apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elk-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.elastic.co
      chart: eck-operator
      targetRevision: 3.2.0
      helm:
        releaseName: eck-operator
    - repoURL: https://helm.elastic.co
      chart: eck-stack
      targetRevision: 0.17.0
      helm:
        releaseName: elk-stack
        values: |
          eck-elasticsearch:
            nodeSets:
              - name: default
                count: 1
                config:
                  node.store.allow_mmap: false
                podTemplate:
                  spec:
                    containers:
                      - name: elasticsearch
                        resources:
                          requests:
                            cpu: 500m
                            memory: 1Gi
                          limits:
                            cpu: "1"
                            memory: 2Gi
          eck-kibana:
            count: 1
            podTemplate:
              spec:
                containers:
                  - name: kibana
                    resources:
                      requests:
                        cpu: 250m
                        memory: 512Mi
                      limits:
                        cpu: "1"
                        memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: elk-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
